name: Gaia Launcher Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to build"
        required: true
        default: "0.5.0-beta.5"
      tag:
        description: "Release tag"
        required: true
        default: "v0.5.0-beta.5"
      release_name:
        description: "Release title"
        required: true
        default: "0.5.0 Beta 5"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            label: Linux
            os: ubuntu-latest
            build_command: pnpm dist:linux
          - platform: macos
            label: macOS
            os: macos-latest
            build_command: pnpm dist:mac
          - platform: windows
            label: Windows
            os: windows-latest
            build_command: pnpm dist:windows
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GAIA_UPDATE_BASE_URL: https://github.com/GaiaChat/Gaia-Launcher/releases/latest/download
      GAIA_RELEASES_URL: https://github.com/GaiaChat/Gaia-Launcher/releases/latest
      GAIA_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libarchive-tools rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp package version
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.GAIA_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid semver version: ${version}`);
          }
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Build release artifacts
        run: ${{ matrix.build_command }}

      - name: Refresh AppImage update metadata
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --config electron-builder.config.cjs --linux AppImage --publish=never

      - name: Verify release artifacts
        run: |
          find release-app -maxdepth 1 -type f -print | sort
          shopt -s nullglob
          assets=(release-app/GaiaLauncher-* release-app/*.yml release-app/*.blockmap)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            metadata_file="release-app/latest-linux.yml"
            if [[ ! -f "${metadata_file}" && "${GAIA_RELEASE_VERSION}" == *-* ]]; then
              channel="${GAIA_RELEASE_VERSION#*-}"
              channel="${channel%%.*}"
              metadata_file="release-app/${channel}-linux.yml"
            fi
            test -f "${metadata_file}"
            cat "${metadata_file}"
            grep -F "version: ${GAIA_RELEASE_VERSION}" "${metadata_file}"
            grep -F "path: GaiaLauncher-${GAIA_RELEASE_VERSION}-x86_64.AppImage" "${metadata_file}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaia-release-${{ matrix.platform }}
          path: |
            release-app/GaiaLauncher-*
            release-app/*.yml
            release-app/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GAIA_RELEASE_VERSION: ${{ inputs.version }}
      GAIA_RELEASE_TAG: ${{ inputs.tag }}
      GAIA_RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_REPO: GaiaChat/Gaia-Launcher
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release
        run: |
          mapfile -t assets < <(find release-artifacts -type f \( \( -name '*.yml' ! -name 'builder-debug.yml' \) -o -name '*.blockmap' -o -name 'GaiaLauncher-*' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi
          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"
          gh release create "${GAIA_RELEASE_TAG}" "${assets[@]}" \
            --repo "${RELEASE_REPO}" \
            --title "${GAIA_RELEASE_NAME}" \
            --notes "Gaia Launcher ${GAIA_RELEASE_NAME} (${GAIA_RELEASE_VERSION})." \
            --latest
